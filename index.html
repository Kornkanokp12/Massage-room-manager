<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nadii Room Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div>
            <h1>Nadii Room Manager</h1>
            <p>Massage Room Management Dashboard</p>
        </div>

        <button id="addRoomBtn">+ Add Room</button>
    </header>

    <main>

        <section class="summary">
            <div class="summary-card">
                <h3>Total Rooms</h3>
                <p id="totalRooms">3</p>
            </div>

            <div class="summary-card">
                <h3>Available</h3>
                <p id="availableRooms">1</p>
            </div>

            <div class="summary-card">
                <h3>In Use</h3>
                <p id="inUseRooms">1</p>
            </div>

            <div class="summary-card">
                <h3>Needs Cleaning</h3>
                <p id="cleaningRooms">1</p>
            </div>
        </section>


        <section class="rooms-section">

            <h2>Treatment Rooms</h2>

            <div id="roomContainer" class="room-container">

                <!-- Room 1 -->
                <div class="room-card">
                    <div class="room-header">
                        <h3>Room 1</h3>
                        <span class="status available">Available</span>
                    </div>

                    <p>
                        <strong>Therapist:</strong>
                        <span class="therapist">Not Assigned</span>
                    </p>

                    <div class="room-actions">
                        <button class="edit-btn">Edit</button>
                        <button class="delete-btn">Delete</button>
                    </div>
                </div>


                <!-- Room 2 -->
                <div class="room-card">
                    <div class="room-header">
                        <h3>Room 2</h3>
                        <span class="status in-use">In Use</span>
                    </div>

                    <p>
                        <strong>Therapist:</strong>
                        <span class="therapist">Anna</span>
                    </p>

                    <div class="room-actions">
                        <button class="edit-btn">Edit</button>
                        <button class="delete-btn">Delete</button>
                    </div>
                </div>


                <!-- Room 3 -->
                <div class="room-card">
                    <div class="room-header">
                        <h3>Room 3</h3>
                        <span class="status cleaning">Needs Cleaning</span>
                    </div>

                    <p>
                        <strong>Therapist:</strong>
                        <span class="therapist">Not Assigned</span>
                    </p>

                    <div class="room-actions">
                        <button class="edit-btn">Edit</button>
                        <button class="delete-btn">Delete</button>
                    </div>
                </div>

            </div>

        </section>

    </main>


    <!-- Add/Edit Room Form -->
    <div id="roomModal" class="modal">

        <div class="modal-content">

            <span id="closeModal" class="close">&times;</span>

            <h2 id="modalTitle">Add Room</h2>

            <form id="roomForm">

                <label for="roomName">Room Name</label>
                <input
                    type="text"
                    id="roomName"
                    placeholder="Example: Room 4"
                    required
                >

                <label for="therapistName">Therapist</label>
                <input
                    type="text"
                    id="therapistName"
                    placeholder="Therapist name"
                >

                <label for="roomStatus">Status</label>

                <select id="roomStatus">

                    <option value="Available">
                        Available
                    </option>

                    <option value="In Use">
                        In Use
                    </option>

                    <option value="Needs Cleaning">
                        Needs Cleaning
                    </option>

                </select>

                <button type="submit" class="save-btn">
                    Save Room
                </button>

            </form>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
