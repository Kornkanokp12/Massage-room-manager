<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nadii Room Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div>
            <h1>Nadii Room Manager</h1>
            <p>Massage Room Management Dashboard</p>
        </div>

        <button id="addRoomBtn">+ Add Room</button>
    </header>


    <main>

        <!-- Dashboard Summary -->
        <section class="summary">

            <div class="summary-card">
                <h3>Total Rooms</h3>
                <p id="totalRooms">0</p>
            </div>

            <div class="summary-card">
                <h3>Available</h3>
                <p id="availableRooms">0</p>
            </div>

            <div class="summary-card">
                <h3>In Use</h3>
                <p id="inUseRooms">0</p>
            </div>

            <div class="summary-card">
                <h3>Needs Cleaning</h3>
                <p id="cleaningRooms">0</p>
            </div>

        </section>


        <!-- Treatment Rooms -->
        <section class="rooms-section">

            <h2>Treatment Rooms</h2>

            <!--
                Rooms are loaded automatically
                from the Supabase database.
            -->
            <div id="roomContainer" class="room-container">
            </div>

        </section>

    </main>


    <!-- Add/Edit Room Modal -->
    <div id="roomModal" class="modal">

        <div class="modal-content">

            <span id="closeModal" class="close">&times;</span>

            <h2 id="modalTitle">Add Room</h2>

            <form id="roomForm">

                <!-- Room Name -->
                <label for="roomName">
                    Room Name
                </label>

                <input
                    type="text"
                    id="roomName"
                    placeholder="Example: Room 4"
                    required
                >


                <!-- Therapist -->
                <label for="therapistName">
                    Therapist
                </label>

                <input
                    type="text"
                    id="therapistName"
                    placeholder="Therapist name"
                >


                <!-- Room Status -->
                <label for="roomStatus">
                    Status
                </label>

                <select id="roomStatus">

                    <option value="Available">
                        Available
                    </option>

                    <option value="In Use">
                        In Use
                    </option>

                    <option value="Needs Cleaning">
                        Needs Cleaning
                    </option>

                </select>


                <!-- Save Button -->
                <button
                    type="submit"
                    class="save-btn"
                >
                    Save Room
                </button>

            </form>

        </div>

    </div>


    <!-- Supabase JavaScript Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Our JavaScript -->
    <script src="script.js"></script>

</body>

</html>
